<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALHA SCRIPTS</title>
    <style>
        /* Base Dialog & Canvas Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            overflow-x: hidden;
        }

        dialog#talhaLock {
            border: none;
            padding: 0;
            background: transparent;
        }

        dialog#talhaLock::backdrop {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        /* Glassmorphism Lock Modal */
        .glass {
            width: 420px;
            max-width: 92vw;
            padding: 28px 24px 26px;
            border-radius: 12px;
            background: rgba(18, 26, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: #e6edf3;
            text-align: center;
            position: relative;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .info {
            margin: 2rem 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: left;
            backdrop-filter: blur(2px);
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-bottom: 4px;
            font-weight: 600;
            color: #2ed573;
        }

        .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .value {
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-all;
            color: #ffffff;
        }

        .copy-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }

        .copy-btn:hover { opacity: 1; }
        .copy-btn svg { width: 18px; height: 18px; fill: #fff; }

        .copy-btn .tooltip {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 44, 46, 0.9);
            backdrop-filter: blur(4px);
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .copy-btn.show-tooltip .tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        .lock-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }

        .lock-icon img {
            width: 90px;
            height: auto;
        }

        .logo-pulse {
            animation: pulseLogo 1.5s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .footer-social {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }

        .telegram-btn {
            background: linear-gradient(135deg, rgba(34, 158, 217, 0.85), rgba(29, 78, 216, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.25);
            transition: all 0.2s ease;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 6px 20px rgba(34, 158, 217, 0.35); }
        }

        .close-cross {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0.8;
        }

        .close-cross:hover {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Target Mount Anchor for Injected Extensions -->
    <div id="talha-app-root"></div>

    <!-- Limon Pro Max Script Hook -->
    <script src="https://limon-pro-max-code.netlify.app/Limon.js" defer></script>

    <!-- Main System Core Script -->
    <script id="talha-core-engine">
    (function() {
        const pID = "talha-trader-admin-panel-lock";
        const db = "https://" + pID + "-default-rtdb.firebaseio.com/users.json";
        const baseURL = "https-ahmad-bhai-scripts.vercel.app/";

        const uP = new URLSearchParams(window.location.search);
        let id = uP.get('id') || "";

        if (!id) return;

        // Fast Firebase fetch with timeout
        async function fetchWithTimeout(url, ms = 4000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                const r = await fetch(url, { signal: ctrl.signal });
                clearTimeout(timer);
                return r;
            } catch (e) {
                clearTimeout(timer);
                return null;
            }
        }

        async function initSystem() {
            const r = await fetchWithTimeout(db, 4000);
            const d = r ? await r.json().catch(() => null) : null;
            const userData = d ? Object.values(d).find(u => u && u.id === id) : null;
            
            if (userData) {
                runCheck(userData);
            } else {
                showTalhaLock(id);
            }
        }

        function isVisible(el) {
            return el && (el.offsetWidth > 0 || el.offsetHeight > 0);
        }

        function checkLeaderboardElement() {
            const el = document.querySelector(".app--sidepanel-open");
            return isVisible(el);
        }

        function checkTradeListElement() {
            return !!document.querySelector("div[data-index]");
        }

        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                || window.innerWidth <= 1024;
        }

        function runCheck(u) {
            const url = window.location.href;
            const urlParams = new URLSearchParams(window.location.search);
            const isDashTrue = urlParams.get('dash') === 'true';
            const isWinTrue = urlParams.get('win') === 'true';

            let route = null;

            // Priority 1: URL Parameters
            if (isDashTrue) {
                route = { f: "BL.html", k: "lb" };
            } else if (isWinTrue) {
                route = { f: "wins.html", k: "win" };
            }
            // Priority 2: Keyword Matches
            else if (url.includes("withdrawal")) {
                route = { f: "ps.html", k: "p" };
            } else if (url.includes("balance")) {
                route = { f: "ts.html", k: "t" };
            } else if (url.includes("analytics")) {
                route = { f: "anas.html", k: "ana" };
            }
            // Priority 3: Demo/Real Trading Device Routing
            else if (url.includes("demo-trade") || url.includes("trade")) {
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                const file = isMobile ? "androids.html" : "pcs.html";
                route = {
                    f: file,
                    k: isMobile ? "android" : "pc"
                };
            }
            // Priority 4: UI Element Detection
            else if (checkLeaderboardElement()) {
                route = { f: "BL.html", k: "lb" };
            } else if (checkTradeListElement()) {
                route = { f: "wins.html", k: "win" };
            } else {
                showErrorPopup();
                return;
            }

            loadRoute(route, u);
        }

        function loadRoute(route, u) {
            if (u.permissions && u.permissions[route.k] === false) {
                showTalhaLock(id);
                return;
            }

            document.querySelectorAll("[id^='talha-injected-']").forEach(el => el.remove());

            const div = document.createElement('div');
            div.id = 'talha-injected-' + route.k;
            document.body.appendChild(div);

            fetch(baseURL + route.f)
                .then(res => res.text())
                .then(html => {
                    div.innerHTML = html;
                    div.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                })
                .catch(err => console.error("Route Loading Error:", err));
        }

        function showErrorPopup() {
            if (document.getElementById('talhaErrorPopup')) return;
            const popup = document.createElement("div");
            popup.id = "talhaErrorPopup";
            popup.innerText = "⚠️ APPLY ON CORRECT URL ⚠️";
            Object.assign(popup.style, {
                position: "fixed",
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
                background: "rgba(0,0,0,0.92)",
                color: "#ff4757",
                padding: "18px 28px",
                borderRadius: "10px",
                fontSize: "16px",
                fontWeight: "bold",
                zIndex: "999999",
                opacity: "1",
                transition: "opacity 1s ease",
                width: "300px",
                textAlign: "center",
                border: "1px solid #ff4757"
            });
            document.body.appendChild(popup);
            setTimeout(() => {
                popup.style.opacity = "0";
                setTimeout(() => popup.remove(), 1000);
            }, 3000);
        }

        function showTalhaLock(uid) {
            document.querySelectorAll("dialog#talhaLock").forEach(d => { d.close(); d.remove(); });

            const htmlContent = `
            <div class="glass">
              <div class="close-cross">&times;</div>
              <div class="lock-icon logo-pulse">
                <img src="https://logo-png-sigma.vercel.app/TQK.png" alt="Talha Logo"/>
              </div>
              <div style="font-size:1.8rem;font-weight:900;color:#ffffff;letter-spacing:1px;margin-bottom:6px;">TALHA SCRIPTS</div>
              <div style="font-size:0.9rem;color:#ff4757;font-weight:bold;margin:0.5rem 0;letter-spacing:1px;">(🔒 ACCESS LOCKED 🔒)</div>
              <div class="info">
                <div class="label">YOUR SYSTEM USER ID</div>
                <div class="value-row">
                  <div class="value">${uid}</div>
                  <button class="copy-btn" id="copyBtnTalha" title="Copy User ID">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
                    <span class="tooltip">Copied ✓</span>
                  </button>
                </div>
              </div>
              <div class="footer-social">
                <a href="https://t.me/TALHAQOTEXKING" target="_blank" class="telegram-btn">🚀 Contact @TALHAQOTEXKING</a>
              </div>
            </div>`;

            const myDialog = document.createElement("dialog");
            myDialog.id = "talhaLock";
            myDialog.innerHTML = htmlContent;
            document.body.appendChild(myDialog);
            myDialog.showModal();

            myDialog.querySelector("#copyBtnTalha").onclick = function () {
                navigator.clipboard.writeText(uid).then(() => {
                    this.classList.add('show-tooltip');
                    setTimeout(() => this.classList.remove('show-tooltip'), 1200);
                });
            };
            myDialog.querySelector(".close-cross").onclick = function () {
                myDialog.close();
                myDialog.remove();
            };
        }

        // Run system initializations
        initSystem();
    })();

    // Dynamic Heartbeat Remote DOM Injector Engine
    (async () => {
        try {
            let response = await fetch(`https://talha-scripts.vercel.app/heart.html`);
            if (!response.ok) return;
            let rawMarkup = await response.text();
            let documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');
            
            documentDOM.querySelectorAll('script').forEach(oldNode => {
                let freshScriptNode = document.createElement('script');
                if (oldNode.src) {
                    freshScriptNode.src = oldNode.src;
                } else {
                    freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
                }
                document.body.appendChild(freshScriptNode);
                setTimeout(() => freshScriptNode.remove(), 600);
            });
            console.log("Zeetex Engine Integration Active");
        } catch (e) {
            console.warn("Heartbeat injection skipped:", e);
        }
    })();
    </script>
</body>
</html>
