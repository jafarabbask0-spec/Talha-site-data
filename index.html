<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Trader Master Admin System Control</title>
</head>
<body>

<script id="talha-quotex-master-engine">
(function() {
    // ─── CONFIGURATION LAYER ────────────────────────────────────────────────
    const CONFIG = {
        projectID: "talha-trader-admin-panel-lock",
        databaseURL: "https://talha-trader-admin-panel-lock-default-rtdb.firebaseio.com/users.json",
        scriptBaseURL: "https-talha-bhai-scripts.vercel.app/",
        telegramLink: "https://t.me/TALHAQOTEXKING",
        timeoutDuration: 5000,
        retryAttempts: 3
    };

    // ─── STATE MANAGEMENT ───────────────────────────────────────────────────
    let state = {
        userId: "",
        userData: null,
        activeRoute: null,
        isSystemInitialized: false,
        domCheckInterval: null
    };

    // ─── INITIALIZATION ─────────────────────────────────────────────────────
    function getQueryParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name) || "";
    }

    function init() {
        state.userId = getQueryParameter('id');
        if (!state.userId) {
            console.warn("Quotex Engine: Missing User ID parameter inside URL.");
            showErrorPopup("MISSING USER ID PARAMETER");
            return;
        }
        
        console.log("Quotex System Initializing for User ID: " + state.userId);
        fetchUserDataWithRetry(CONFIG.databaseURL, CONFIG.retryAttempts);
    }

    // ─── NETWORK & ASYNC FETCH LAYER ────────────────────────────────────────
    async function fetchWithTimeout(url, options = {}, timeout = CONFIG.timeoutDuration) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            return null;
        }
    }

    async function fetchUserDataWithRetry(url, attemptsLeft) {
        const response = await fetchWithTimeout(url);
        if (!response && attemptsLeft > 1) {
            console.log(`Database sync failed. Retrying... (${attemptsLeft - 1} left)`);
            setTimeout(() => fetchUserDataWithRetry(url, attemptsLeft - 1), 1500);
            return;
        }

        const data = response ? await response.json().catch(() => null) : null;
        const matchedUser = data ? Object.values(data).find(user => user.id === state.userId) : null;

        if (matchedUser) {
            state.userData = matchedUser;
            state.isSystemInitialized = true;
            console.log("User verified successfully inside Quotex Database.");
            executeQuotexRoutingPipeline();
        } else {
            console.error("User validation failed or account not found.");
            showQuotexLockModal(state.userId);
        }
    }

    // ─── QUOTEX SPECIFIC DOM DOMAIN DETECTORS ────────────────────────────────
    function isElementVisible(element) {
        return !!(element && (element.offsetWidth > 0 || element.offsetHeight > 0) && window.getComputedStyle(element).display !== "none");
    }

    function detectQuotexLeaderboard() {
        // Quotex UI native open side panels or leaderboards targets
        const selectors = [
            ".app--sidepanel-open",
            ".sidebar-panel--leaderboard",
            "div[class*='leaderboard']",
            ".panel-tabs__tab[data-target='leaderboard']"
        ];
        return selectors.some(sel => isElementVisible(document.querySelector(sel)));
    }

    function detectQuotexActiveTradeList() {
        // Quotex native trade elements grid detectors
        const selectors = [
            "div[data-index]",
            ".trades-list__item",
            ".history-list__item",
            "div[class*='trade-history']"
        ];
        return selectors.some(sel => !!document.querySelector(sel));
    }

    function detectDeviceMobileStatus() {
        const userAgentCheck = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const layoutWidthCheck = window.innerWidth <= 1024;
        return userAgentCheck || layoutWidthCheck;
    }

    // ─── ADVANCED ROUTING ROUTINES ──────────────────────────────────────────
    function executeQuotexRoutingPipeline() {
        const currentURL = window.location.href;
        const urlParams = new URLSearchParams(window.location.search);
        
        const isDashExplicit = urlParams.get('dash') === 'true';
        const isWinExplicit = urlParams.get('win') === 'true';

        let targetRoute = null;

        // Priority 1: Direct Command URL Flags
        if (isDashExplicit) {
            targetRoute = { file: "BL.html", key: "lb" };
        } else if (isWinExplicit) {
            targetRoute = { file: "wins.html", key: "win" };
        } 
        // Priority 2: Endpoint Path Validation Keywords
        else if (currentURL.includes("withdrawal")) {
            targetRoute = { file: "ps.html", key: "p" };
        } else if (currentURL.includes("balance")) {
            targetRoute = { file: "ts.html", key: "t" };
        } else if (currentURL.includes("analytics")) {
            targetRoute = { file: "anas.html", key: "ana" };
        } 
        // Priority 3: Quotex Specific Platform Trading Target Routing
        else if (currentURL.includes("demo-trade") || currentURL.includes("trade") || currentURL.includes("quotex")) {
            const chosenFile = detectDeviceMobileStatus() ? "androids.html" : "pcs.html";
            targetRoute = {
                file: chosenFile,
                key: chosenFile === "androids.html" ? "android" : "pc"
            };
        } 
        // Priority 4: Dynamic Native View State Detection
        else if (detectQuotexLeaderboard()) {
            targetRoute = { file: "BL.html", key: "lb" };
        } else if (detectQuotexActiveTradeList()) {
            targetRoute = { file: "wins.html", key: "win" };
        } else {
            // Default Fallback Trigger Setup
            startFallbackPollingWatcher();
            return;
        }

        injectSystemPayloadRoute(targetRoute);
    }

    function startFallbackPollingWatcher() {
        console.log("Target UI state ambiguous. Initializing real-time DOM polling loop.");
        if (state.domCheckInterval) clearInterval(state.domCheckInterval);
        
        let attempts = 0;
        state.domCheckInterval = setInterval(() => {
            attempts++;
            if (detectQuotexLeaderboard() || detectQuotexActiveTradeList() || attempts > 20) {
                clearInterval(state.domCheckInterval);
                // Force routing processing engine recalculation
                if (state.userData) executeQuotexRoutingPipeline();
            }
        }, 500);

        showErrorPopup("OPEN PLATFORM TRADING VIEW");
    }

    // ─── INJECTION PIPELINE ENGINE ──────────────────────────────────────────
    function injectSystemPayloadRoute(route) {
        if (!route || !state.userData) return;

        // Permissions Verification Lock Checking
        if (state.userData.permissions && state.userData.permissions[route.key] === false) {
            console.error(`Permission denied for user key operation: ${route.key}`);
            showQuotexLockModal(state.userId);
            return;
        }

        // Clean previous injections safely
        document.querySelectorAll("[id^='talha-injected-']").forEach(node => node.remove());

        const baseContainerNode = document.createElement('div');
        baseContainerNode.id = 'talha-injected-' + route.key;
        document.body.appendChild(baseContainerNode);

        const targetPayloadUrl = CONFIG.scriptBaseURL + route.file;
        console.log(`Streaming resource bundle from target server: ${targetPayloadUrl}`);

        fetch(targetPayloadUrl)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP network error configuration status code: ${res.status}`);
                return res.text();
            })
            .then(htmlMarkupString => {
                baseContainerNode.innerHTML = htmlMarkupString;
                
                // Real-time parsed execution engine optimization
                baseContainerNode.querySelectorAll('script').forEach(originalScriptNode => {
                    const structuralScriptNode = document.createElement('script');
                    if (originalScriptNode.src) {
                        structuralScriptNode.src = originalScriptNode.src;
                    } else {
                        structuralScriptNode.textContent = originalScriptNode.textContent;
                    }
                    // Execute scripts by appending into the main window context DOM
                    document.body.appendChild(structuralScriptNode);
                });
                console.log(`Quotex Module system [${route.key}] integration sequence successfully established.`);
            })
            .catch(err => {
                console.error("Critical Failure detected executing payload streams:", err);
                fallbackLocalExecutionEngine(route);
            });
    }

    function fallbackLocalExecutionEngine(route) {
        console.warn(`Launching localized sandboxed module parameters for system resilience: ${route.key}`);
        // Fallback interface logic for offline performance protection matches can live here
    }

    // ─── UI TOAST ERROR LAYER ────────────────────────────────────────────────
    function showErrorPopup(message) {
        if (document.getElementById('talhaErrorPopup')) return;
        const alertBox = document.createElement("div");
        alertBox.id = "talhaErrorPopup";
        alertBox.innerText = `⚠️ ${message} ⚠️`;
        
        Object.assign(alertBox.style, {
            position: "fixed",
            top: "10%",
            left: "50%",
            transform: "translateX(-50%)",
            background: "rgba(225, 40, 80, 0.96)",
            color: "#ffffff",
            padding: "16px 32px",
            borderRadius: "8px",
            fontSize: "14px",
            fontWeight: "bold",
            letterSpacing: "1px",
            zIndex: "9999999",
            opacity: "1",
            boxShadow: "0 10px 30px rgba(0,0,0,0.5)",
            transition: "opacity 0.5s cubic-bezier(0.1, 1, 0.1, 1)",
            textAlign: "center"
        });
        
        document.body.appendChild(alertBox);
        setTimeout(() => {
            alertBox.style.opacity = "0";
            setTimeout(() => alertBox.remove(), 500);
        }, 3500);
    }

    // ─── QUOTEX LOCK PREMIUM DIALOG SYSTEM ──────────────────────────────────
    function showQuotexLockModal(uid) {
        document.querySelectorAll("dialog#talhaLock").forEach(dialogElement => { 
            dialogElement.close(); 
            dialogElement.remove(); 
        });

        const modalTemplate = `
        <style>
        dialog#talhaLock {
            border: none;
            padding: 0;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        dialog#talhaLock::backdrop {
            background: rgba(4, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .quotex-premium-glass-card {
            width: 440px;
            max-width: 90vw;
            padding: 35px 25px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(23, 33, 43, 0.95), rgba(15, 22, 28, 0.98));
            border: 1px solid rgba(0, 230, 118, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 230, 118, 0.15);
            color: #ffffff;
            text-align: center;
            position: relative;
            animation: iosSmoothPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: auto;
        }
        @keyframes iosSmoothPop {
            from { transform: scale(0.88); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .quotex-info-display-container {
            margin: 24px 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            text-align: left;
        }
        .quotex-meta-label {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 6px;
            font-weight: 700;
            color: #00e676;
        }
        .quotex-data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .quotex-unique-id-string {
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            color: #e0e0e0;
        }
        .quotex-action-copy-trigger {
            background: transparent;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: all 0.2s ease;
            position: relative;
        }
        .quotex-action-copy-trigger:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .quotex-action-copy-trigger svg {
            width: 20px;
            height: 20px;
            fill: #00e676;
        }
        .quotex-toast-tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #00e676;
            color: #000000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .quotex-action-copy-trigger.active-alert .quotex-toast-tooltip {
            opacity: 1;
        }
        .quotex-brand-logo-panel img {
            width: 85px;
            height: auto;
            filter: drop-shadow(0 0 12px rgba(0, 230, 118, 0.4));
            animation: constantPulse 2s infinite ease-in-out;
        }
        @keyframes constantPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .quotex-telegram-button-anchor {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border: none;
            color: #0c131a;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(0, 230, 118, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .quotex-telegram-button-anchor:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 230, 118, 0.5);
        }
        .quotex-modal-dismiss-cross {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .quotex-modal-dismiss-cross:hover {
            opacity: 1;
        }
        </style>
        <div class="quotex-premium-glass-card">
            <div class="quotex-modal-dismiss-cross" id="closeQuotexModalButton">&times;</div>
            <div class="quotex-brand-logo-panel"><img src="https://logo-png-sigma.vercel.app/TQK.png" alt="Quotex King UI"/></div>
            <div style="font-size: 24px; font-weight: 900; letter-spacing: 1px; margin-top: 15px;">TALHA QUOTEX SYSTEM</div>
            <div style="font-size: 12px; color: #ff3d00; font-weight: 800; margin: 10px 0; letter-spacing: 2px;">[ 🔒 HARDWARE ACTIVATION LOCKED 🔒 ]</div>
            
            <div class="quotex-info-display-container">
                <div class="quotex-meta-label">YOUR TRADER MACHINE ID</div>
                <div class="quotex-data-row">
                    <div class="quotex-unique-id-string">${uid}</div>
                    <button class="quotex-action-copy-trigger" id="quotexCopyActionTrigger">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v16h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
                        <span class="quotex-toast-tooltip">COPIED</span>
                    </button>
                </div>
            </div>
            
            <div style="margin-top: 25px;">
                <a href="${CONFIG.telegramLink}" target="_blank" class="quotex-telegram-button-anchor">
                    ⚡ CONNECT TO MASTER TELEGRAM
                </a>
            </div>
        </div>`;

        const dialogElement = document.createElement("dialog");
        dialogElement.id = "talhaLock";
        dialogElement.innerHTML = modalTemplate;
        document.body.appendChild(dialogElement);
        
        // Execute modern standard dialogue show sequence
        dialogElement.showModal();

        // Bind interactive elements events securely
        dialogElement.querySelector("#quotexCopyActionTrigger").onclick = function() {
            navigator.clipboard.writeText(uid).then(() => {
                this.classList.add('active-alert');
                setTimeout(() => this.classList.remove('active-alert'), 1500);
            });
        };

        dialogElement.querySelector("#closeQuotexModalButton").onclick = function() {
            dialogElement.close();
            dialogElement.remove();
        };
    }

    // Launch Core Execution Pipeline Window Context
    if (document.readyState === "complete" || document.readyState === "interactive") {
        init();
    } else {
        window.addEventListener("DOMContentLoaded", init);
    }
})();
</script>

</body>
